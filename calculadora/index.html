<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculadora Profesional</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <main class="calculator">

        <section class="calculator__header">
            <h1>Calculadora</h1>
            <span>Calculadora básica</span>
        </section>

        <section class="calculator__display">
            <div id="previous-operation" class="display__previous"></div>

            <div id="current-operation" class="display__current">
                0
            </div>
        </section>

        <section class="calculator__buttons">

            <button
                class="button button--function"
                data-action="clear">
                AC
            </button>

            <button
                class="button button--function"
                data-action="delete">
                ⌫
            </button>

            <button
                class="button button--operator"
                data-action="operator"
                data-value="/">
                ÷
            </button>

            <button
                class="button button--operator"
                data-action="operator"
                data-value="*">
                ×
            </button>


            <button class="button" data-value="7">7</button>
            <button class="button" data-value="8">8</button>
            <button class="button" data-value="9">9</button>

            <button
                class="button button--operator"
                data-action="operator"
                data-value="-">
                −
            </button>


            <button class="button" data-value="4">4</button>
            <button class="button" data-value="5">5</button>
            <button class="button" data-value="6">6</button>

            <button
                class="button button--operator"
                data-action="operator"
                data-value="+">
                +
            </button>


            <button class="button" data-value="1">1</button>
            <button class="button" data-value="2">2</button>
            <button class="button" data-value="3">3</button>

            <button
                class="button button--equals"
                data-action="calculate">
                =
            </button>


            <button
                class="button button--zero"
                data-value="0">
                0
            </button>

            <button
                class="button"
                data-value=".">
                .
            </button>

        </section>

        <footer class="calculator__footer">
            <span>Calculadora Web</span>
        </footer>

    </main>


    <script src="js/calculator.js"></script>

</body>
</html>
